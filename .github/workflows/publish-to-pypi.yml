name: Publish to PyPI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'  # release tags vYYYY.MM[.N]; any other tag must not publish

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install project and test dependencies
      run: python -m pip install -e ".[train]" pytest pytest-mock
    - name: Run test suite
      run: python -m pytest
    - name: Install pypa/build
      run: >-
        python3 -m
        pip install
        build
        --user
    - name: Build a binary wheel and a source tarball
      run: python3 -m build
    - name: Verify installed wheel and CLI entry points
      run: |
        python -m pip install --force-reinstall --no-deps dist/*.whl
        cd "${RUNNER_TEMP}"
        fennol_md --help
        fennol_train --help
        fennol_analyze --help
    - name: Verify installed source distribution
      run: |
        python -m pip install --force-reinstall --no-deps dist/*.tar.gz
        cd "${RUNNER_TEMP}"
        fennol_md --help
        fennol_train --help
    - name: Store the distribution packages
      uses: actions/upload-artifact@v4
      with:
        name: python-package-distributions
        path: dist/
  
  publish-to-pypi:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/')  # only publish to PyPI on tag pushes
    needs:
    - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/FeNNol
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing
    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v4
      with:
        name: python-package-distributions
        path: dist/
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
